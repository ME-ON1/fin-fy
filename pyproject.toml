[project]
name = "fin-fy"
version = "0.1.0"
description = "Self-hosted shared monthly ledger: upload UPI/bank statement PDFs, track month-wise spending per UPI ID, split 'both' transactions between people"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.9.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "pdfplumber>=0.11.10",
    "reportlab>=5.0.0",
    "python-multipart>=0.0.32",
    "splitwise>=3.0.0",
]
