# fin-fy self-hosted database server: libsql (sqld)
# - data lives in the `finfy-sqld-data` volume on this machine
# - ports are bound to 127.0.0.1 only: only the fin-fy app can reach them
# - 8080 = Hrana over HTTP (Turso/pyturso clients), 5001 = legacy WS Hrana

services:

  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: fin-fy-sqld
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
    volumes:
      - finfy-sqld-data:/data
    environment:
      SQLD_NODE: standalone
      SQLD_DB_PATH: /data/iku.db
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    command: ["/bin/sqld", "--hrana-listen-addr", "0.0.0.0:5001"]
    user: "0"

volumes:
  finfy-sqld-data:
